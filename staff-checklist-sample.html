<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<title>PIP Staff Checklist</title><link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Raleway:wght@400;500;600;700;800&display=swap">
<style>
:root { --ink:#1a3a4a; --body:#33414f; --grey:#6f7986; --accent:#0873B5; --sky:#55b9d7;
  --pill:#d6edf4; --pilltext:#1E6FA0; --card:#f4f8fb; --border:#c9d5df; --rule:#dce5ec; --foot:#8a96a5; }
* { box-sizing:border-box; }
body { margin:0; background:#fff; color:var(--body); font:15px/1.5 'Raleway',Helvetica,sans-serif; }
.wrap { max-width:860px; margin:0 auto; padding:0 16px; }
header .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; padding:16px; border-bottom:1px solid var(--rule); }
header img { height:34px; width:auto; max-width:60vw; }
.pill { background:var(--pill); color:var(--pilltext); border-radius:20px; padding:5px 12px; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; white-space:nowrap; }
h1 { font-weight:800; color:var(--ink); font-size:28px; line-height:1.15; margin:22px 0 6px; }
.lead { color:var(--grey); margin:0 0 18px; }
.k { display:block; font-size:11px; font-weight:700; letter-spacing:.14em; text-transform:uppercase; color:var(--accent); margin-bottom:5px; }
.card { background:var(--card); border:1px solid var(--border); border-radius:12px; padding:16px; margin-bottom:12px; }
.grid { display:grid; grid-template-columns:repeat(auto-fit,minmax(200px,1fr)); gap:12px; }
input[type=text], select, textarea { width:100%; font:inherit; color:var(--body); border:1px solid var(--border); border-radius:8px; padding:9px 10px; background:#fff; }
textarea { min-height:60px; resize:vertical; }
details.sec { background:#fff; border:1px solid var(--border); border-radius:12px; margin-bottom:10px; }
details.sec > summary { list-style:none; cursor:pointer; padding:14px 16px; display:flex; justify-content:space-between; align-items:center; font-weight:700; color:var(--ink); font-size:16px; }
details.sec > summary::-webkit-details-marker { display:none; }
.count { font-size:12px; font-weight:700; color:#fff; background:var(--accent); border-radius:20px; padding:2px 10px; }
.count.zero { color:var(--grey); background:var(--card); border:1px solid var(--border); }
.items { padding:0 16px 14px; }
.item { display:flex; gap:10px; align-items:flex-start; padding:10px 0; border-top:1px solid var(--rule); cursor:pointer; }
.item input { margin-top:3px; width:20px; height:20px; accent-color:var(--accent); flex:none; }
.lab { font-weight:700; color:var(--ink); }
.ow { font-size:13px; color:var(--grey); }
.mand { font-size:10px; font-weight:700; letter-spacing:.08em; text-transform:uppercase; color:var(--pilltext); background:var(--pill); border-radius:10px; padding:1px 7px; margin-left:6px; vertical-align:2px; }
.bar { position:fixed; left:0; right:0; bottom:0; background:#fff; border-top:1px solid var(--rule); }
.bar .wrap { display:flex; justify-content:space-between; align-items:center; gap:12px; flex-wrap:wrap; padding:12px 16px; }
button { font:700 15px 'Raleway',sans-serif; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 18px; cursor:pointer; }
button.ghost { background:#fff; color:var(--accent); border:1px solid var(--accent); }
.note { font-size:12px; color:var(--grey); }
#preview { display:none; } #preview ol { margin:6px 0 0; padding-left:18px; }
main { padding-bottom:110px; }
</style></head><body>

const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'})[c]);
function sectionList() {
  const n = id => +document.getElementById(id).value;
  const out = [["Overall property","Overall property"],["Exterior","Exterior"],["Garden","Garden"]];
  for (let i=1;i<=n('nLiv');i++) out.push(["Living area "+i,"Living area"]);
  for (let i=1;i<=n('nBed');i++) out.push(["Bedroom "+i,"Bedroom"]);
  for (let i=1;i<=n('nBth');i++) out.push(["Bathroom "+i,"Bathroom"]);
  out.push(["Other comments","Other comments"]); return out;
}
const state = {"Overall property":{ticks:{"OVR-01":true,"OVR-04":true,"OVR-05":true},comment:""},"Bedroom 2":{ticks:{"BED-01":true,"BED-07":true},comment:""}};
function render() {
  const host = document.getElementById('sections'); host.innerHTML = '';
  sectionList().forEach(([name, type]) => {
    const st = state[name] || (state[name] = {ticks:{}, comment:''});
    const d = document.createElement('details'); d.className='sec'; d.dataset.name = name; if (name==='Overall property') d.open = true;
    d.innerHTML = '<summary><span>'+esc(name)+'</span><span class="count"></span></summary><div class="items">' +
      LIB.filter(x => x.section === type).map(it => '<label class="item"><input type="checkbox" data-id="'+it.item_id+'"'+(st.ticks[it.item_id]?' checked':'')+'><span><span class="lab">'+esc(it.staff_label)+'</span>'+(it.mandatory==='Y'?'<span class="mand">Mandatory</span>':'')+'<br><span class="ow">'+esc(it.owner_wording)+'</span></span></label>').join('') +
      '<div style="margin-top:8px"><span class="k">Comment for owner (optional)</span><textarea placeholder="Shown under this area in the owner plan">'+esc(st.comment)+'</textarea></div></div>';
    d.querySelectorAll('input[type=checkbox]').forEach(cb => cb.onchange = () => { st.ticks[cb.dataset.id] = cb.checked; tally(); });
    d.querySelector('textarea').oninput = e => { st.comment = e.target.value; tally(); };
    host.appendChild(d);
  }); tally();
}
function tally() {
  let t=0, s=0;
  document.querySelectorAll('details.sec').forEach(d => {
    const st = state[d.dataset.name], c = Object.values(st.ticks).filter(Boolean).length, has = c || st.comment.trim();
    const el = d.querySelector('.count'); el.textContent = c+' ticked'+(st.comment.trim()?' + note':''); el.classList.toggle('zero', !has);
    t+=c; if (has) s++;
  });
  document.getElementById('tot').textContent = t+(t===1?' item':' items');
  document.getElementById('totS').textContent = 'in '+s+(s===1?' area':' areas');
  if (document.getElementById('preview').style.display==='block') preview();
}
function preview() {
  let h='';
  sectionList().forEach(([name]) => { const st=state[name]; if(!st) return; const its=LIB.filter(x=>st.ticks[x.item_id]);
    if(!its.length && !st.comment.trim()) return;
    h+='<p style="margin:10px 0 0;font-weight:700;color:var(--ink)">'+esc(name)+'</p><ol>'+its.map(i=>'<li>'+esc(i.owner_wording)+'</li>').join('')+'</ol>'+(st.comment.trim()?'<p class="note">'+esc(st.comment)+'</p>':''); });
  document.getElementById('pv').innerHTML = h || '<p class="note">Nothing ticked yet. An empty plan cannot be generated.</p>';
}
['nLiv','nBed','nBth'].forEach(id => document.getElementById(id).onchange = render);
document.getElementById('pvBtn').onclick = () => { const p=document.getElementById('preview'); p.style.display = p.style.display==='block'?'none':'block'; preview(); };
render();
</script></body></html>
